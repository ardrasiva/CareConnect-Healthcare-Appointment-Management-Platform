<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Administrator Login</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body class="bg-light">

<div class="container">

    <div class="row justify-content-center mt-5">

        <div class="col-md-5">

            <div class="card">

                <div class="card-header bg-dark text-white">

                    Administrator Login

                </div>

                <div class="card-body">

                    <div
                        th:if="${param.error}"
                        class="alert alert-danger"
                    >
                        Invalid email or password.
                    </div>

                    <div
                        th:if="${param.logout}"
                        class="alert alert-success"
                    >
                        You have been logged out.
                    </div>

                    <form
                        th:action="@{/login}"
                        method="post"
                    >

                        <div class="mb-3">

                            <label
                                for="username"
                                class="form-label"
                            >
                                Email
                            </label>

                            <input
                                type="email"
                                id="username"
                                name="username"
                                class="form-control"
                                required
                            >

                        </div>

                        <div class="mb-3">

                            <label
                                for="password"
                                class="form-label"
                            >
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                class="form-control"
                                required
                            >

                        </div>

                        <input
                            type="hidden"
                            th:name="${_csrf?.parameterName}"
                            th:value="${_csrf?.token}"
                        >

                        <button
                            type="submit"
                            class="btn btn-primary w-100"
                        >
                            Login
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
