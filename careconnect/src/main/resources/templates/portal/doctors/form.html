<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Add Doctor</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div
    th:replace="~{portal/fragments/header :: header}"
>
</div>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 p-0">

            <div
                th:replace="~{portal/fragments/sidebar :: sidebar}"
            >
            </div>

        </div>

        <div class="col-md-10 p-4">

            <h2
                class="mb-4"
                th:text="${doctor.id == null
                    ? 'Add Doctor'
                    : 'Edit Doctor'}"
            >
                Add Doctor
            </h2>


            <form
                th:action="${doctor.id == null}
                    ? @{/doctors/add}
                    : @{/doctors/edit/{id}(id=${doctor.id})}"
                th:object="${doctor}"
                method="post"
            >

                <input
                    type="hidden"
                    th:name="${_csrf?.parameterName}"
                    th:value="${_csrf?.token}"
                >


                <!-- NAME -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Name
                    </label>

                    <input
                        type="text"
                        th:field="*{name}"
                        class="form-control"
                        required
                    >

                </div>


                <!-- SPECIALIZATION -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Specialization
                    </label>

                    <input
                        type="text"
                        th:field="*{specialization}"
                        class="form-control"
                        required
                    >

                </div>


                <!-- QUALIFICATION -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Qualification
                    </label>

                    <input
                        type="text"
                        th:field="*{qualification}"
                        class="form-control"
                        required
                    >

                </div>


                <!-- EXPERIENCE -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Experience
                    </label>

                    <input
                        type="number"
                        th:field="*{experience}"
                        class="form-control"
                        min="0"
                        required
                    >

                </div>


                <!-- PHONE NUMBER -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Phone Number
                    </label>

                    <input
                        type="text"
                        th:field="*{phoneNumber}"
                        class="form-control"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Email
                    </label>

                    <input
                        type="email"
                        th:field="*{email}"
                        class="form-control"
                        required
                    >

                </div>


                <!-- CONSULTATION FEE -->

                <div class="mb-3">

                    <label
                        class="form-label"
                    >
                        Consultation Fee
                    </label>

                    <input
                        type="number"
                        th:field="*{consultationFee}"
                        class="form-control"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <!-- ACTIVE -->

                <div class="form-check mb-3">

                    <input
                        type="checkbox"
                        th:field="*{isActive}"
                        class="form-check-input"
                    >

                    <label
                        class="form-check-label"
                    >
                        Active
                    </label>

                </div>


                <!-- BUTTONS -->

                <a
                    href="/doctors"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save Doctor
                </button>

            </form>

        </div>

    </div>

</div>


<!-- ========================================================= -->
<!-- DUPLICATE DOCTOR MODAL -->
<!-- ========================================================= -->

<div
    class="modal fade"
    id="duplicateDoctorModal"
    tabindex="-1"
    aria-labelledby="duplicateDoctorModalLabel"
    aria-hidden="true"
    th:if="${duplicateError}"
>

    <div class="modal-dialog">

        <div class="modal-content">

            <div class="modal-header">

                <h5
                    class="modal-title"
                    id="duplicateDoctorModalLabel"
                >
                    Doctor Already Exists
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                    aria-label="Close"
                >
                </button>

            </div>


            <div class="modal-body">

                <p
                    th:text="${duplicateError}"
                >
                    Doctor already exists.
                </p>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-primary"
                    data-bs-dismiss="modal"
                >
                    OK
                </button>

            </div>

        </div>

    </div>

</div>


<!-- Bootstrap JavaScript -->

<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
>
</script>


<!-- Automatically open duplicate modal -->

<script th:if="${duplicateError}">

    const duplicateModal =
        new bootstrap.Modal(
            document.getElementById(
                "duplicateDoctorModal"
            )
        );

    duplicateModal.show();

</script>


</body>

</html>
