<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Doctor Management</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div
    th:replace="~{portal/fragments/header :: header}"
>
</div>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 p-0">

            <div
                th:replace="~{portal/fragments/sidebar :: sidebar}"
            >
            </div>

        </div>

        <div class="col-md-10 p-4">

            <div class="d-flex
                        justify-content-between
                        align-items-center
                        mb-4">

                <h2>Doctor Management</h2>
<form
    method="get"
    th:action="@{/doctors}"
    class="row g-3 mb-4"
>

    <div class="col-md-5">

        <input
            type="text"
            name="search"
            class="form-control"
            placeholder="Search by name or specialization"
            th:value="${search}"
        >

    </div>

    <div class="col-md-2">

        <button
            type="submit"
            class="btn btn-primary"
        >
            Search
        </button>

    </div>
    

</form>
                <a
                    href="/doctors/add"
                    class="btn btn-primary"
                >
                    Add Doctor
                </a>

            </div>
            <div
    th:if="${message}"
    class="alert alert-success"
>
    <span th:text="${message}"></span>
</div>


<div
    th:if="${error}"
    class="alert alert-danger"
>
    <span th:text="${error}"></span>
</div>
            <table class="table table-bordered
                          table-hover">

                <thead>

                    <tr>

                        <th>Name</th>
                        <th>Specialization</th>
                        <th>Contact</th>
                        <th>Actions</th>

                    </tr>

                </thead>

                <tbody>

                    <tr
                        th:each="doctor : ${doctors}"
                    >

                        <td
                            th:text="${doctor.name}"
                        >
                        </td>

                        <td
                            th:text="${doctor.specialization}"
                        >
                        </td>

                        <td
                            th:text="${doctor.phoneNumber}"
                        >
                        </td>

                        <td>

                            <a
                                th:href="@{/doctors/edit/{id}(id=${doctor.id})}"
                                class="btn btn-sm btn-warning"
                            >
                                Edit
                            </a>

                            <form
    th:action="@{/doctors/delete/{id}(id=${doctor.id})}"
    method="post"
    class="d-inline"
>

    <input
        type="hidden"
        th:name="${_csrf?.parameterName}"
        th:value="${_csrf?.token}"
    >

    <button
        type="submit"
        class="btn btn-sm btn-danger"
        onclick="return confirm(
    'Are you sure you want to delete this doctor?'
)"
    >
        Delete
    </button>

</form>

                        </td>

                    </tr>

                    <tr
                        th:if="${#lists.isEmpty(doctors)}"
                    >

                        <td
                            colspan="4"
                            class="text-center"
                        >
                            No doctors available.
                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
