<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Appointment Details</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div
    th:replace="~{portal/fragments/header :: header}"
>
</div>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 p-0">

            <div
                th:replace="~{portal/fragments/sidebar :: sidebar}"
            >
            </div>

        </div>

        <div class="col-md-10 p-4">

            <h2 class="mb-4">
                Appointment Details
            </h2>

            <div class="card">

                <div class="card-body">

                    <dl class="row">

                        <dt class="col-sm-3">
                            Patient
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${appointment.patient.firstName}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Doctor
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${appointment.doctor.name}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Date
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${appointment.appointmentDate}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Time
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${appointment.appointmentTime}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Status
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${appointment.status}"
                        >
                        </dd>

                    </dl>

                    <a
                        th:href="@{/appointments}"
                        class="btn btn-secondary"
                    >
                        Back
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>

</html>
