<!DOCTYPE html>
<html
    lang="en"
    xmlns:th="http://www.thymeleaf.org"
>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Profile</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>

<body>

<div
    th:replace="~{portal/fragments/header :: header}"
>
</div>

<div class="container-fluid">

    <div class="row">

        <div class="col-md-2 p-0">

            <div
                th:replace="~{portal/fragments/sidebar :: sidebar}"
            >
            </div>

        </div>

        <div class="col-md-10 p-4">

            <h2 class="mb-4">
                User Profile
            </h2>


            <div class="card mb-4">

                <div class="card-body">

                    <h5 class="card-title">
                        Patient Information
                    </h5>

                    <dl class="row mt-3">

                        <dt class="col-sm-3">
                            Name
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${user.firstName
                                + ' '
                                + user.lastName}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Email
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${user.email}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Contact
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${user.phoneNumber}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Date of Birth
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${user.dateOfBirth}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Gender
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${user.gender}"
                        >
                        </dd>


                        <dt class="col-sm-3">
                            Address
                        </dt>

                        <dd
                            class="col-sm-9"
                            th:text="${user.address}"
                        >
                        </dd>

                    </dl>

                </div>

            </div>


            <div class="card">

                <div class="card-header">

                    Appointment History

                </div>

                <div class="card-body p-0">

                    <table class="table
                                  table-bordered
                                  table-hover
                                  mb-0">

                        <thead>

                            <tr>

                                <th>Date</th>
                                <th>Doctor</th>
                                <th>Status</th>

                            </tr>

                        </thead>

                        <tbody>

                            <tr
                                th:each="appointment :
                                ${appointments}"
                            >

                                <td
                                    th:text="${appointment.appointmentDate}"
                                >
                                </td>

                                <td
                                    th:text="${appointment.doctor.name}"
                                >
                                </td>

                                <td
                                    th:text="${appointment.status}"
                                >
                                </td>

                            </tr>

                            <tr
                                th:if="${#lists.isEmpty(
                                    appointments
                                )}"
                            >

                                <td
                                    colspan="3"
                                    class="text-center"
                                >
                                    No appointments available.
                                </td>

                            </tr>

                        </tbody>

                    </table>

                </div>

            </div>


            <a
                th:href="@{/users}"
                class="btn btn-secondary mt-3"
            >
                Back
            </a>

        </div>

    </div>

</div>

</body>

</html>
